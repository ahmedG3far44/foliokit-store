name: foliokit-production

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env.production}
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: https://foliokit.store
      PUBLIC_API_URL: https://api.foliokit.store
      LOCAL_MEDIA_BASE_URL: https://api.foliokit.store
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:?Set VITE_BASE_URL in client/.env.production}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in client/.env.production}
    restart: unless-stopped
    env_file:
      - ${CLIENT_ENV_FILE:-./client/.env.production}
    environment:
      CLIENT_DOMAIN: foliokit.store
      API_DOMAIN: api.foliokit.store
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_challenges:/var/www/certbot:ro
      - nginx_tls_certs:/etc/nginx/certs
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env.production}
    environment:
      CLIENT_DOMAIN: foliokit.store
      API_DOMAIN: api.foliokit.store
    command:
      - -c
      - |
        trap exit TERM
        : "$${ACME_EMAIL:?Set ACME_EMAIL in server/.env.production}"
        while :; do
          if certbot certonly --webroot --webroot-path /var/www/certbot \
              --non-interactive --agree-tos --no-eff-email --keep-until-expiring \
              --email "$$ACME_EMAIL" -d "$$CLIENT_DOMAIN" -d "$$API_DOMAIN"; then
            wait_seconds=43200
            if [ -f "/etc/letsencrypt/live/$$CLIENT_DOMAIN/fullchain.pem" ]; then
              cp "/etc/letsencrypt/live/$$CLIENT_DOMAIN/fullchain.pem" /etc/nginx/certs/fullchain.pem.next
              cp "/etc/letsencrypt/live/$$CLIENT_DOMAIN/privkey.pem" /etc/nginx/certs/privkey.pem.next
              mv /etc/nginx/certs/fullchain.pem.next /etc/nginx/certs/fullchain.pem
              mv /etc/nginx/certs/privkey.pem.next /etc/nginx/certs/privkey.pem
              chmod 600 /etc/nginx/certs/privkey.pem
            fi
          else
            wait_seconds=300
          fi
          sleep "$$wait_seconds" & wait $$!
        done
    volumes:
      - certbot_challenges:/var/www/certbot
      - certbot_data:/etc/letsencrypt
      - nginx_tls_certs:/etc/nginx/certs
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend

volumes:
  certbot_challenges:
  certbot_data:
  nginx_tls_certs:

networks:
  frontend:
