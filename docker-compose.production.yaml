name: foliokit-production

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-manual}
      CLIENT_URL: https://foliokit.store
      PUBLIC_API_URL: https://api.foliokit.store
      LOCAL_MEDIA_BASE_URL: https://api.foliokit.store
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in GitHub Actions secrets}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in GitHub Actions secrets}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in GitHub Actions secrets}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in GitHub Actions secrets}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in GitHub Actions secrets}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in GitHub Actions secrets}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:?Set PAYPAL_CLIENT_ID in GitHub Actions secrets}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:?Set PAYPAL_CLIENT_SECRET in GitHub Actions secrets}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:?Set PAYPAL_WEBHOOK_ID in GitHub Actions secrets}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-live}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-}
      PAYMOB_INTEGRATION_IDS: ${PAYMOB_INTEGRATION_IDS:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
      PAYMOB_CURRENCY: ${PAYMOB_CURRENCY:-EGP}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in GitHub Actions secrets}
      EMAIL_FROM_ACCOUNT: ${EMAIL_FROM_ACCOUNT:?Set EMAIL_FROM_ACCOUNT in GitHub Actions secrets}
      EMAIL_FROM_BILLING: ${EMAIL_FROM_BILLING:?Set EMAIL_FROM_BILLING in GitHub Actions secrets}
      EMAIL_FROM_MARKETING: ${EMAIL_FROM_MARKETING:?Set EMAIL_FROM_MARKETING in GitHub Actions secrets}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?Set EMAIL_REPLY_TO in GitHub Actions secrets}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in GitHub Actions secrets}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in GitHub Actions secrets}
      R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET in GitHub Actions secrets}
      R2_MEDIA_URL_TTL_SECONDS: ${R2_MEDIA_URL_TTL_SECONDS:-3600}
      R2_DOWNLOAD_URL_TTL_SECONDS: ${R2_DOWNLOAD_URL_TTL_SECONDS:-90}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-10}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-250}
      MAX_THEME_ZIP_SIZE_MB: ${MAX_THEME_ZIP_SIZE_MB:-100}
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-https://api.foliokit.store/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in GitHub Actions secrets}
    restart: unless-stopped
    environment:
      CLIENT_DOMAIN: foliokit.store
      API_DOMAIN: api.foliokit.store
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_challenges:/var/www/certbot:ro
      - nginx_tls_certs:/etc/nginx/certs
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    environment:
      CLIENT_DOMAIN: foliokit.store
      API_DOMAIN: api.foliokit.store
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in GitHub Actions secrets}
    command:
      - -c
      - |
        trap exit TERM
        : "$${ACME_EMAIL:?Set ACME_EMAIL in GitHub Actions secrets}"
        while :; do
          if certbot certonly --webroot --webroot-path /var/www/certbot \
              --non-interactive --agree-tos --no-eff-email --keep-until-expiring \
              --email "$$ACME_EMAIL" -d "$$CLIENT_DOMAIN" -d "$$API_DOMAIN"; then
            wait_seconds=43200
            if [ -f "/etc/letsencrypt/live/$$CLIENT_DOMAIN/fullchain.pem" ]; then
              cp "/etc/letsencrypt/live/$$CLIENT_DOMAIN/fullchain.pem" /etc/nginx/certs/fullchain.pem.next
              cp "/etc/letsencrypt/live/$$CLIENT_DOMAIN/privkey.pem" /etc/nginx/certs/privkey.pem.next
              mv /etc/nginx/certs/fullchain.pem.next /etc/nginx/certs/fullchain.pem
              mv /etc/nginx/certs/privkey.pem.next /etc/nginx/certs/privkey.pem
              chmod 600 /etc/nginx/certs/privkey.pem
            fi
          else
            wait_seconds=300
          fi
          sleep "$$wait_seconds" & wait $$!
        done
    volumes:
      - certbot_challenges:/var/www/certbot
      - certbot_data:/etc/letsencrypt
      - nginx_tls_certs:/etc/nginx/certs
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - frontend

volumes:
  certbot_challenges:
  certbot_data:
  nginx_tls_certs:

networks:
  frontend:
