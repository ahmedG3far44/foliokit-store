name: foliokit-development

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_development_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    restart: unless-stopped
    init: true
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env.development}
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongodb:27017/saas
      PUBLIC_API_URL: http://localhost:5000
      LOCAL_MEDIA_BASE_URL: http://localhost:5000
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared:ro
      - server_node_modules:/app/server/node_modules
      - server_local_uploads:/app/server/local-uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: development
    restart: unless-stopped
    init: true
    env_file:
      - ${CLIENT_ENV_FILE:-./client/.env.development}
    environment:
      VITE_BASE_URL: http://localhost:5000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared:ro
      - client_node_modules:/app/client/node_modules
    depends_on:
      server:
        condition: service_healthy
    networks:
      - frontend

volumes:
  mongodb_development_data:
  server_node_modules:
  client_node_modules:
  server_local_uploads:

networks:
  frontend:
  backend:
    internal: true
